name: Secret Scan

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GITLEAKS_VERSION: 8.18.4
      # From gitleaks_8.18.4_checksums.txt on the upstream release page.
      GITLEAKS_SHA256: ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks-action needs a paid license for organizations, so run the
      # open-source CLI directly instead. The tarball is verified against a
      # pinned SHA256 before anything from it is executed.
      - name: Install Gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" gitleaks
          rm "$tarball"
          ./gitleaks version

      - name: Run Gitleaks
        run: ./gitleaks detect --source . --redact --verbose
