name: Lighthouse CI

on:
  pull_request:
    branches: [main, v2]
  workflow_dispatch:

# Non-required check initially — can be marked required later once baselines stabilize.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Public pages performance & a11y
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: "0"

      # `npm run lighthouse` builds the app, then `lhci autorun` starts it via
      # `startServerCommand` in lighthouserc.json — the same command as locally.
      - name: Build and run Lighthouse CI
        run: npm run lighthouse
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: https://nexafx-backend.onrender.com/v1
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 14
