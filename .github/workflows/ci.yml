name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

jobs:
  ci:
    name: Lint, Type-check, Build & E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: "0"

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Smoke tests
        run: npm run smoke

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          E2E_MOCK: "1"

      - name: Bundle size budget (#1076)
        run: npm run check:bundle

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E Tests (#1072, #1073)
        run: npm run e2e
        env:
          E2E_MOCK: "1"
          CI: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
