name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

jobs:
  ci:
    name: Lint, Type-check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies for known vulnerabilities
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Smoke tests
        run: npm run smoke

      - name: Unit tests
        run: npm test

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Accessibility scan (axe-core)
        run: |
          npm start &
          npx wait-on http://localhost:3000 --timeout 30000
          npx axe http://localhost:3000 --exit
          kill %1 || true

      - name: E2E Tests
        run: npm run e2e
